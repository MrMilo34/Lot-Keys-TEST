name: Build LotKeys Phone Mirror

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-phone-mirror.yml'
      - 'device-bridge/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('.')
          with zipfile.ZipFile('/tmp/LotKeys-Phone-Mirror-Source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and '.git' not in p.parts and '.gradle' not in p.parts and 'build' not in p.parts:
                      z.write(p, p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LotKeys-Phone-Mirror-Source
          path: /tmp/LotKeys-Phone-Mirror-Source.zip
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android companion
        working-directory: device-bridge/android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LotKeys-Phone-Mirror-APK
          path: device-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LotKeys-Phone-Mirror-Build-Reports
          path: device-bridge/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
