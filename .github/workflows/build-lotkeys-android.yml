name: Build LotKeys Android Layer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-lotkeys-android.yml'
      - 'android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android test layer
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LotKeys-Android-V0.9.4.87
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LotKeys-Android-Build-Reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
