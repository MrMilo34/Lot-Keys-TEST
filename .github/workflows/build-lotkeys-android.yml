name: Build LotKeys Android Layer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-lotkeys-android.yml'
      - 'android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare stable TEST signing identity
        env:
          LOTKEYS_TEST_KEYSTORE_B64: ${{ secrets.LOTKEYS_TEST_KEYSTORE_B64 }}
          LOTKEYS_TEST_KEYSTORE_PASSWORD: ${{ secrets.LOTKEYS_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$LOTKEYS_TEST_KEYSTORE_B64" ] && [ -n "$LOTKEYS_TEST_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$LOTKEYS_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lotkeys-test.keystore"
            echo "LOTKEYS_TEST_KEYSTORE_PATH=$RUNNER_TEMP/lotkeys-test.keystore" >> "$GITHUB_ENV"
            echo "LOTKEYS_TEST_KEYSTORE_PASSWORD=$LOTKEYS_TEST_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LOTKEYS_TEST_KEY_ALIAS=lotkeys-test" >> "$GITHUB_ENV"
            echo "LOTKEYS_TEST_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Stable TEST signing secrets are not configured; CI will validate code but will not publish an APK."
            echo "LOTKEYS_TEST_SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Build and lint Android test layer
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify registered TEST certificate
        if: success() && env.LOTKEYS_TEST_SIGNED == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-signing.txt"
          grep -Fqi 'd518a4693ada9f62bdb16517382b174c52a57612' "$RUNNER_TEMP/apk-signing.txt"
      - uses: actions/upload-artifact@v4
        if: success() && env.LOTKEYS_TEST_SIGNED == 'true'
        with:
          name: LotKeys-Android-V0.9.5.01
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LotKeys-Android-Build-Reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
