plugins { id 'com.android.application' }
android {
    namespace 'ca.lotkeys.bridge'
    compileSdk 35
    defaultConfig { applicationId 'ca.lotkeys.mirror'; minSdk 30; targetSdk 35; versionCode 20; versionName '0.2.0-sms-mirror-test' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { disable 'BatteryLife'; warningsAsErrors false }
    buildTypes { release { minifyEnabled false } }
}
